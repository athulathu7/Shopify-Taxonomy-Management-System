
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Shopify Product Classifier</title>

    <style>


        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f6f7f9;

            color: #1f2937;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;

        }


        .circle {

            position: absolute;

            border-radius: 50%;

            opacity: 0.5;

        }


        .circle-one {

            width: 300px;

            height: 300px;

            background: #e8f7f2;

            top: -140px;

            left: -100px;

        }


        .circle-two {

            width: 350px;

            height: 350px;

            background: #eefaf6;

            bottom: -180px;

            right: -130px;

        }

        .login-card {

            width: 100%;

            max-width: 400px;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 32px 34px;

            position: relative;

            z-index: 1;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.07);

        }



        .logo {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;

        }


        .logo-icon {

            width: 42px;

            height: 42px;

            border-radius: 10px;

            background: #008060;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            font-weight: 800;

            box-shadow:
                0 5px 14px
                rgba(0, 128, 96, 0.20);

        }


        .logo-text {

            display: flex;

            flex-direction: column;

            line-height: 1.1;

        }


        .logo-main {

            color: #111827;

            font-size: 18px;

            font-weight: 800;

        }


        .logo-sub {

            color: #008060;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1px;

            margin-top: 4px;

        }


        .login-header {

            text-align: center;

            margin-bottom: 23px;

        }


        .login-header h1 {

            margin: 0;

            color: #111827;

            font-size: 24px;

            font-weight: 750;

            letter-spacing: -0.5px;

        }


        .login-header p {

            margin: 7px 0 0;

            color: #9ca3af;

            font-size: 12px;

            line-height: 1.5;

        }


        .error {

            color: #b91c1c;

            background: #fef2f2;

            border: 1px solid #fecaca;

            padding: 10px 12px;

            border-radius: 8px;

            margin-bottom: 17px;

            font-size: 12px;

        }

        .form-group {

            margin-bottom: 16px;

        }


        label {

            display: block;

            margin-bottom: 6px;

            color: #374151;

            font-size: 11px;

            font-weight: 700;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 12px;

            top: 50%;

            transform: translateY(-50%);

            color: #9ca3af;

            font-size: 13px;

            pointer-events: none;

        }


        input {

            width: 100%;

            height: 42px;

            padding:
                0 12px 0 36px;

            margin: 0;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            outline: none;

            background: #ffffff;

            color: #111827;

            font-family: inherit;

            font-size: 12px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        input::placeholder {

            color: #9ca3af;

        }


        input:focus {

            border-color: #008060;

            box-shadow:
                0 0 0 3px
                rgba(0, 128, 96, 0.09);

        }

        .login-button {

            width: 100%;

            height: 43px;

            margin-top: 4px;

            border: none;

            border-radius: 8px;

            background: #008060;

            color: #ffffff;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            transition:
                background 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.2s ease;

        }


        .login-button:hover {

            background: #006e52;

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px
                rgba(0, 128, 96, 0.18);

        }


        .login-button:active {

            transform: translateY(0);

        }


        .register-link {

            text-align: center;

            margin-top: 18px;

            color: #9ca3af;

            font-size: 11px;

        }


        .register-link a {

            color: #008060;

            text-decoration: none;

            font-weight: 700;

        }


        .register-link a:hover {

            text-decoration: underline;

        }


        .security {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            margin-top: 18px;

            padding-top: 16px;

            border-top: 1px solid #f0f1f3;

            color: #9ca3af;

            font-size: 9px;

        }


        .footer {

            text-align: center;

            margin-top: 18px;

            color: #9ca3af;

            font-size: 9px;

            line-height: 1.6;

        }


        .footer strong {

            color: #008060;

            font-weight: 600;

        }



        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .login-card {

                max-width: 370px;

                padding: 27px 24px;

                border-radius: 12px;

            }


            .logo {

                margin-bottom: 21px;

            }


            .login-header h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>



<div class="background">

    <div class="circle circle-one"></div>

    <div class="circle circle-two"></div>

</div>



<div class="login-card">


    <div class="logo">

        <div class="logo-icon">
            S
        </div>

        <div class="logo-text">

            <span class="logo-main">
                Shopify
            </span>

            <span class="logo-sub">
                PRODUCT CLASSIFIER
            </span>

        </div>

    </div>


    <div class="login-header">

        <h1>
            Welcome back
        </h1>

        <p>
            Sign in to access your product
            classification dashboard.
        </p>

    </div>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form
        method="POST"
        action="{% url 'login' %}"
    >

        {% csrf_token %}


        <div class="form-group">

            <label>
                Username
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
        >

            Sign In

            <span>
                →
            </span>

        </button>


    </form>

    <div class="register-link">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create an account
        </a>

    </div>


    <div class="security">

        🔒

        Secure administrator access

    </div>


    <div class="footer">

        Shopify Product Classifier

        <br>

        <strong>
            Product Taxonomy Management System
        </strong>

    </div>


</div>


</body>

</html>
